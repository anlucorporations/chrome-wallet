<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/TrueKeate_logoIntegral.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCrypto Wallet — Solicitud de firma</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
      }
      
      .notification-container {
        width: 400px;
        height: 600px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, var(--navy-800) 0%, var(--teal-500) 100%);
        color: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      
      .notification-header {
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid rgba(255,255,255,0.2);
      }
      
      .notification-header h1 {
        margin: 0;
        font-size: 24px;
      }
      
      .notification-header p {
        margin: 5px 0 0 0;
        opacity: 0.8;
        font-size: 14px;
      }
      
      .notification-content {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: white;
        color: var(--navy-900);
      }
      
      .notification-content h2 {
        margin-top: 0;
        color: var(--navy-800);
      }
      
      .tx-details {
        background: var(--smoke);
        border-radius: 8px;
        padding: 15px;
        margin: 15px 0;
      }
      
      .detail-item {
        margin: 15px 0;
        padding: 10px;
        background: white;
        border-radius: 6px;
        border-left: 3px solid var(--navy-800);
      }
      
      .detail-label {
        font-weight: bold;
        color: var(--navy-800);
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      
      .detail-value {
        color: var(--navy-900);
        word-break: break-all;
        font-size: 14px;
        line-height: 1.4;
      }
      
      .detail-value.code {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        background: var(--smoke);
        padding: 5px;
        border-radius: 4px;
      }
      
      .json-container {
        margin: 15px 0;
        background: white;
        border-radius: 6px;
        overflow: hidden;
      }
      
      .json-label {
        font-weight: bold;
        color: var(--navy-800);
        font-size: 12px;
        text-transform: uppercase;
        padding: 10px;
        background: var(--smoke);
        border-bottom: 2px solid var(--navy-800);
      }
      
      .json-display {
        margin: 0;
        padding: 15px;
        background: var(--smoke);
        font-family: 'Courier New', monospace;
        font-size: 11px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
        color: var(--navy-900);
        max-height: 300px;
        overflow-y: auto;
      }
      
      .notification-actions {
        padding: 20px;
        display: flex;
        gap: 10px;
        background: var(--smoke);
        border-top: 1px solid rgba(26, 43, 76, 0.15);
      }
      
      .notification-actions button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: var(--radius-pill);
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      .btn-reject {
        background: var(--crimson);
        color: white;
      }
      
      .btn-reject:hover {
        background: #cc0000;
      }
      
      .btn-approve {
        background: var(--teal-500);
        color: white;
      }
      
      .btn-approve:hover {
        background: #007E33;
      }
      
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notification-main.tsx"></script>
  </body>
</html>
