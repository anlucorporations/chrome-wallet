# ═══════════════════════════════════════════════════════════════════
# Foundry — CodeCrypto Wallet
# ═══════════════════════════════════════════════════════════════════
# Nodo local de desarrollo: anvil (sustituye a `npx hardhat node`).
#   arranque:  npm run chain        → http://127.0.0.1:8545 (chainId 31337)
#   mnemonic:  test test test test test test test test test test test junk
#   cuentas:   10 × 10 000 ETH (idénticas a las de Hardhat, cuenta 0 =
#              0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266)
# ═══════════════════════════════════════════════════════════════════

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Muestra siempre el resumen de compilación (útil en clase)
verbosity = 2

# Redes accesibles con --rpc-url <alias>
# Ejemplos:
#   forge create contracts/WalletPlayground.sol:WalletPlayground --rpc-url local --private-key <KEY>
#   cast balance 0xf39F... --rpc-url local
[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "https://rpc.sepolia.org"

[fmt]
line_length = 100
tab_width = 4
